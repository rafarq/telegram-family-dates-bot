      align-items: center;
      justify-content: center;

      padding: 16px;
    }

    .backdrop-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(12, 24, 60, 0.25) 0%, rgba(5, 10, 28, 0.68) 100%);
      pointer-events: none;
      z-index: 1;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .container {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 480px;
      margin: auto;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      background: rgba(15, 26, 58, 0.70);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(112, 161, 255, 0.45);
      border-radius: 30px;
      padding: 34px 26px 30px;
      text-align: center;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.5), 0 0 35px rgba(255, 215, 0, 0.15);
      animation: celestialEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .icon-badge {
      font-size: clamp(48px, 12vw, 64px);
      line-height: 1;
      margin-bottom: 14px;
      filter: drop-shadow(0 6px 16px rgba(255, 215, 0, 0.35));
      animation: floatHalo 3s infinite ease-in-out;
    }

    .tag-tipo {
      display: inline-block;
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      padding: 6px 20px;
      border-radius: 50px;
      background: linear-gradient(135deg, #1e90ff, #ffa502);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      margin-bottom: 14px;
      animation: fadeInDown 0.8s 0.2s ease-out both;
    }

    .nombre {
      font-size: clamp(28px, 7.5vw, 42px);
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.7), 0 0 25px #70a1ff88;
      margin-bottom: 12px;
      word-break: break-word;
      animation: zoomIn 0.8s 0.3s ease-out both;
    }

    .divider {
      width: 65px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #70a1ff, transparent);
      border-radius: 2px;
      margin: 4px 0 16px;
      animation: expandDivider 0.8s 0.4s ease-out both;
    }

    .mensaje {
      font-size: clamp(15px, 4.2vw, 18px);
      line-height: 1.65;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 18px 22px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.25);
      margin-bottom: 24px;
      width: 100%;
      word-break: break-word;
      animation: fadeInUp 0.8s 0.5s ease-out both;
    }

    .fecha-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 6px 20px;
      font-size: clamp(12px, 3.2vw, 14px);
      color: #eccc68;
      letter-spacing: 1px;
      font-weight: 500;
      animation: fadeInUp 0.8s 0.6s ease-out both;
    }

    .sparkle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #70a1ff;
      box-shadow: 0 0 12px #70a1ff;
      animation: sacredPulse 2s infinite alternate;
    }

    /* Animations */
    @keyframes celestialEntrance {
      0% { opacity: 0; transform: translateY(40px) scale(0.92); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes floatHalo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes fadeInDown {
      0% { opacity: 0; transform: translateY(-15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes expandDivider {
      0% { width: 0; opacity: 0; }
      100% { width: 65px; opacity: 1; }
    }

    @keyframes sacredPulse {
      0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 5px #70a1ff; }
      100% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px #70a1ff; }
    }
  </style>
</head>
<body>

  <div class="backdrop-overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <main class="container">
    <article class="card">
      <div class="icon-badge">⛅</div>
      <div class="tag-tipo">{{TIPO}}</div>
      <h1 class="nombre">{{NOMBRE}}</h1>
      <div class="divider"></div>
      <p class="mensaje">{{MENSAJE}}</p>
      <div class="fecha-wrapper">
        <span class="sparkle-dot"></span>
        <span class="fecha">{{FECHA}}</span>
      </div>
    </article>
  </main>

  <script>
    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const colors = ['#70a1ff', '#eccc68', '#ffffff', '#ffd166', '#d4af37', '#90e0ef'];

      class StardustParticle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * w;
          this.y = h + Math.random() * 20;
          this.size = Math.random() * 3.5 + 1.2;
          this.speedY = Math.random() * 0.8 + 0.3;
          this.speedX = (Math.random() - 0.5) * 0.4;
          this.alpha = Math.random() * 0.8 + 0.2;
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.pulse = Math.random() * Math.PI;
        }
        update() {
          this.y -= this.speedY;
          this.pulse += 0.03;
          this.x += this.speedX + Math.sin(this.pulse) * 0.3;
          if (this.y < -20) this.reset();
        }
        draw() {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = Math.max(0, this.alpha * Math.sin(this.pulse));
          ctx.shadowBlur = 10;
          ctx.shadowColor = this.color;
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = 0; i < 40; i++) {
        const p = new StardustParticle();
        p.y = Math.random() * h;
        particles.push(p);
      }

      function animate() {
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
