      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px;
    }

    .backdrop-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(35, 10, 20, 0.25) 0%, rgba(15, 4, 10, 0.68) 100%);
      pointer-events: none;
      z-index: 1;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .container {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 480px;
      margin: auto;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      background: rgba(28, 10, 22, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 234, 167, 0.45);
      border-radius: 30px;
      padding: 34px 26px 30px;
      text-align: center;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.5), 0 0 35px rgba(255, 77, 109, 0.18);
      animation: passionEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .icon-badge {
      font-size: clamp(48px, 12vw, 64px);
      line-height: 1;
      margin-bottom: 14px;
      filter: drop-shadow(0 6px 16px rgba(255, 77, 109, 0.4));
      animation: pulseHeart 2.2s infinite ease-in-out;
    }

    .tag-tipo {
      display: inline-block;
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2.8px;
      padding: 6px 20px;
      border-radius: 50px;
      background: linear-gradient(135deg, #d63031, #fdcb6e);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      margin-bottom: 14px;
      animation: fadeInDown 0.8s 0.2s ease-out both;
    }

    .nombre {
      font-size: clamp(28px, 7.5vw, 42px);
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.7), 0 0 25px #ffeaa788;
      margin-bottom: 12px;
      word-break: break-word;
      animation: zoomIn 0.8s 0.3s ease-out both;
    }

    .divider {
      width: 65px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ffeaa7, transparent);
      border-radius: 2px;
      margin: 4px 0 16px;
      animation: expandDivider 0.8s 0.4s ease-out both;
    }

    .mensaje {
      font-size: clamp(15px, 4.2vw, 18px);
      line-height: 1.65;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 18px 22px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.25);
      margin-bottom: 24px;
      width: 100%;
      word-break: break-word;
      animation: fadeInUp 0.8s 0.5s ease-out both;
    }

    .fecha-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 6px 20px;
      font-size: clamp(12px, 3.2vw, 14px);
      color: #ff7675;
      letter-spacing: 1px;
      font-weight: 500;
      animation: fadeInUp 0.8s 0.6s ease-out both;
    }

    .sparkle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffeaa7;
      box-shadow: 0 0 12px #ffeaa7;
      animation: heartPulse 1.8s infinite alternate;
    }

    /* Animations */
    @keyframes passionEntrance {
      0% { opacity: 0; transform: translateY(40px) scale(0.92); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes fadeInDown {
      0% { opacity: 0; transform: translateY(-15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes expandDivider {
      0% { width: 0; opacity: 0; }
      100% { width: 65px; opacity: 1; }
    }

    @keyframes heartPulse {
      0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 5px #ffeaa7; }
      100% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px #ffeaa7; }
    }
  </style>
</head>
<body>

  <div class="backdrop-overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <main class="container">
    <article class="card">
      <div class="icon-badge">💑</div>
      <div class="tag-tipo">{{TIPO}}</div>
      <h1 class="nombre">{{NOMBRE}}</h1>
      <div class="divider"></div>
      <p class="mensaje">{{MENSAJE}}</p>
      <div class="fecha-wrapper">
        <span class="sparkle-dot"></span>
        <span class="fecha">{{FECHA}}</span>
      </div>
    </article>
  </main>

  <script>
    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const colors = ['#ffeaa7', '#ff7675', '#ffffff', '#ff4d6d', '#ffd166', '#ff758f'];

      class HeartParticle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * w;
          this.y = h + Math.random() * 30;
          this.size = Math.random() * 5 + 2.5;
          this.speedY = Math.random() * 1.3 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.8;
          this.alpha = Math.random() * 0.7 + 0.3;
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.phase = Math.random() * Math.PI * 2;
        }
        update() {
          this.y -= this.speedY;
          this.phase += 0.03;
          this.x += this.speedX + Math.sin(this.phase) * 0.6;
          if (this.y < -25) this.reset();
        }
        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.beginPath();
          // Draw mini heart shape
          const s = this.size;
          ctx.moveTo(0, s * 0.3);
          ctx.bezierCurveTo(-s, -s * 0.6, -s * 1.4, s * 0.6, 0, s * 1.5);
          ctx.bezierCurveTo(s * 1.4, s * 0.6, s, -s * 0.6, 0, s * 0.3);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = this.alpha;
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = 0; i < 35; i++) {
        const p = new HeartParticle();
        p.y = Math.random() * h;
        particles.push(p);
      }

      function animate() {
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
