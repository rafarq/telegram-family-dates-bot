    .backdrop-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(10, 5, 20, 0.25) 0%, rgba(5, 2, 10, 0.65) 100%);
      pointer-events: none;
      z-index: 1;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .container {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 480px;
      margin: auto;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      background: rgba(20, 15, 30, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 209, 102, 0.4);
      border-radius: 28px;
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 0 30px rgba(255, 215, 0, 0.1);
      animation: cardAppear 0.9s cubic-bezier(0.18, 0.89, 0.32, 1.25) both;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .icon-badge {
      font-size: clamp(48px, 12vw, 64px);
      line-height: 1;
      margin-bottom: 14px;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
      animation: bounceBadge 2.2s infinite ease-in-out;
    }

    .tag-tipo {
      display: inline-block;
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      padding: 6px 18px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff9f1c, #ff4081);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      margin-bottom: 14px;
      animation: fadeInDown 0.8s 0.2s ease-out both;
    }

    .nombre {
      font-size: clamp(28px, 7.5vw, 42px);
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.6), 0 0 20px #ffd16666;
      margin-bottom: 12px;
      word-break: break-word;
      animation: zoomIn 0.8s 0.3s ease-out both;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ffd166, transparent);
      border-radius: 2px;
      margin: 4px 0 16px;
      animation: expandDivider 0.8s 0.4s ease-out both;
    }

    .mensaje {
      font-size: clamp(15px, 4.2vw, 18px);
      line-height: 1.6;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      margin-bottom: 22px;
      width: 100%;
      word-break: break-word;
      animation: fadeInUp 0.8s 0.5s ease-out both;
    }

    .fecha-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 6px 18px;
      font-size: clamp(12px, 3.2vw, 14px);
      color: #ff9f1c;
      letter-spacing: 1px;
      font-weight: 500;
      animation: fadeInUp 0.8s 0.6s ease-out both;
    }

    .sparkle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 10px #ffd166;
      animation: pulseGlow 1.8s infinite alternate;
    }

    /* Animations */
    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(35px) scale(0.92); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes bounceBadge {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.06); }
    }

    @keyframes fadeInDown {
      0% { opacity: 0; transform: translateY(-15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes expandDivider {
      0% { width: 0; opacity: 0; }
      100% { width: 60px; opacity: 1; }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 4px #ffd166; }
      100% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px #ffd166; }
    }
  </style>
</head>
<body>

  <div class="backdrop-overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <main class="container">
    <article class="card">
      <div class="icon-badge">🎈</div>
      <div class="tag-tipo">{{TIPO}}</div>
      <h1 class="nombre">{{NOMBRE}}</h1>
      <div class="divider"></div>
      <p class="mensaje">{{MENSAJE}}</p>
      <div class="fecha-wrapper">
        <span class="sparkle-dot"></span>
        <span class="fecha">{{FECHA}}</span>
      </div>
    </article>
  </main>

  <script>
    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const particleType = "balloons_confetti";
      const colors = ['#ffd166', '#ff9f1c', '#ffffff', '#ffd166', '#ff5964', '#35a7ff', '#38b000'];

      class Particle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * w;
          this.y = h + Math.random() * 30;
          this.size = Math.random() * 5 + 2;
          this.speedY = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() - 0.5) * 1.2;
          this.alpha = Math.random() * 0.7 + 0.3;
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.rotation = Math.random() * Math.PI * 2;
          this.vRot = (Math.random() - 0.5) * 0.05;
          this.shape = Math.random() > 0.4 ? 'circle' : 'rect';
        }
        update() {
          this.y -= this.speedY;
          this.x += this.speedX + Math.sin(this.y * 0.02) * 0.4;
          this.rotation += this.vRot;
          if (this.y < -30) this.reset();
        }
        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = this.color;
          if (this.shape === 'rect') {
            ctx.fillRect(-this.size, -this.size * 0.6, this.size * 2, this.size * 1.2);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      for (let i = 0; i < 45; i++) {
        const p = new Particle();
        p.y = Math.random() * h;
        particles.push(p);
      }

      function animate() {
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
